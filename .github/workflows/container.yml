name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  TEST_IMAGE: kube-tools:test
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime and tool versions
        run: docker run --rm --entrypoint /bin/sh "${TEST_IMAGE}" -c "$(cat scripts/verify-tools.sh)"

      - name: Show Go build metadata
        run: |
          set -eu
          container_id="$(docker create "${TEST_IMAGE}")"
          metadata_dir="${RUNNER_TEMP}/go-metadata"
          mkdir -p "${metadata_dir}"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          for binary in helm kubectl kustomize yq; do
            docker cp "${container_id}:/usr/local/bin/${binary}" "${metadata_dir}/${binary}"
          done
          docker run --rm -v "${metadata_dir}:/binaries:ro" golang:1.27.1-alpine             sh -c 'for binary in /binaries/*; do go version -m "$binary"; done'

      - name: Trivy informational scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Generate Trivy JSON diagnostics
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Annotate Critical/High findings
        run: |
          jq -r '
            .Results[]
            | select(.Vulnerabilities != null)
            | .Target as $target
            | .Vulnerabilities[]
            | "::error title=Trivy \(.VulnerabilityID) [\(.Severity)]::\($target): \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "unfixed")"
          ' trivy-results.json

      - name: Upload SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output: kube-tools.spdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kube-tools-sbom-${{ github.sha }}
          path: kube-tools.spdx.json
          if-no-files-found: error

      - name: Enforce Critical/High security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-test-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Remove all superseded GHCR image versions
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          keep_tag="sha-${GITHUB_SHA::7}"
          gh api --paginate --slurp "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/kube/versions?per_page=100" |
            jq -r --arg keep "${keep_tag}" '.[][] | select((.metadata.container.tags // []) | length > 0) | select(any(.metadata.container.tags[]; . == $keep or . == "latest") | not) | .id' |
            while read -r version_id; do
              gh api --method DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/kube/versions/${version_id}"
            done
